  <text x="42" y="506" fill="#f8f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Revision</text>
  <rect x="330" y="318" width="290" height="220" rx="18" fill="#141414" stroke="#3a3a42" stroke-width="2" />
  <text x="352" y="506" fill="#f8f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Maintenance</text>
