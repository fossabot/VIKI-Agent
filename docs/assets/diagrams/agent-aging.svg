      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0b0bc" />
    </marker>
  </defs>
  <text x="40" y="48" fill="#b0b0bc" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">Four mechanisms of agent aging</text>
  <rect x="20" y="78" width="290" height="220" rx="18" fill="#141414" stroke="#3a3a42" stroke-width="2" />
  <text x="42" y="266" fill="#f8f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Compression</text>
