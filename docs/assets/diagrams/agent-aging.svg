<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Four mechanisms of agent aging</title>
  <desc id="desc">Compression can lose details. Interference can confuse similar memories. Revision can leave outdated state. Maintenance can introduce regressions. Mechanisms described by Zhu and colleagues in Your Agents Are Aging Too, 2026. These illustrations are conceptual and do not show VIKI Agent benchmark results.</desc>
  <rect width="640" height="560" fill="#0b0b0b" />
